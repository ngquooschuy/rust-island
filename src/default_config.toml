# Cấu hình Dynamic Island
# Không cần sửa tay: chuột phải lên island hoặc icon khay > "Cài đặt…".
# File này do cửa sổ Cài đặt tự ghi. Nếu vẫn sửa tay thì thoát app rồi mở lại để áp dụng.
# Xóa file này để quay về mặc định. Dòng bắt đầu bằng # là chú thích.

[window]
# Khoảng cách từ mép trên màn hình, đơn vị pixel (0–300)
top = 10
# Chiều rộng khi thu gọn (180–300) và khi mở rộng (320–700)
collapsed_width = 220
expanded_width = 400
# Làm mờ nội dung desktop phía sau island (cần Windows 11):
#   "none"    không làm mờ
#   "blur"    kính mờ của Windows
#   "acrylic" kính mờ thêm lớp hạt nhiễu, giống menu Start
# Chỉ thấy khi nền trong suốt, ví dụ background = "#0F1112A0" ở mục [colors].
# Tắt "Hiệu ứng trong suốt" trong Cài đặt Windows thì lớp kính thành màu đặc.
backdrop = "none"

[colors]
# Dạng "#RRGGBB", hoặc "#RRGGBBAA" để trong suốt: AA từ 00 (trong suốt hẳn) tới FF (đục).
# Nền trong suốt thì chữ và biểu tượng vẫn sắc nét, chỉ nền là nhìn xuyên qua được.
background = "#0F1112"
text = "#F5F5F7"
secondary = "#8E8E93" # tên nghệ sĩ, ngày tháng, vạch ngăn
accent = "#4CC2EA"    # thanh pin, chấm phân trang đang chọn

[font]
# Tên font đã cài trên máy, ví dụ "Segoe UI", "Arial", "Consolas"
family = "Segoe UI"

[clock]
hour24 = true       # false: kiểu 12 giờ (SA/CH)
show_seconds = true # hiện giây khi mở rộng

[weather]
# Lấy thời tiết từ open-meteo.com (miễn phí, 15 phút cập nhật một lần)
enabled = true      # false: không dùng mạng, bên phải hiện pin thay cho thời tiết
city = "Hà Nội"     # tên thành phố, tiếng Việt hay tiếng Anh đều được
fahrenheit = false  # true: hiện °F

[autohide]
# Notch Auto-Hide: thu nhỏ island thành một vạch nhỏ khi không dùng.
# Rê chuột vào vạch đó để hiện lại; đổi bài hát cũng tự hiện lại.
enabled = true
delay_seconds = 5         # số giây không dùng trước khi thu nhỏ (1–3600)
stay_while_playing = true # đang phát nhạc thì không thu nhỏ

[lyrics]
# Lời bài hát chạy theo nhạc, lấy từ lrclib.net (miễn phí, mã nguồn mở).
# Khi tra lời, tên bài, nghệ sĩ, album và thời lượng của bài đang phát được gửi tới LRCLIB.
enabled = true # false: không gọi mạng, không hiện lời
show = true    # hiện khung lời khi mở rộng trang nhạc (nút bên phải hàng nút để bật/tắt)
# Hiện câu đang hát ngay trên island thu gọn; island giãn ngang cho vừa câu.
# Bật/tắt nhanh: chuột phải lên island hoặc icon khay > "Hiện lời bài hát trên island thu gọn"
collapsed = false
# Bộ nhớ đệm trên đĩa (thư mục lyrics cạnh file này), mỗi bài một file nhỏ.
# Đầy thì xóa bài lâu không nghe nhất trước; lời quá 90 ngày được tải lại.
# 0 = tắt (không đọc/ghi đĩa); gợi ý 10, 25 hoặc 100 (MB).
cache_mb = 25

[alerts]
# Thông báo tạm thời trên island, kèm biểu tượng 64px của ứng dụng
clipboard = true     # nội dung vừa sao chép (mật khẩu từ trình quản lý mật khẩu không hiện)
notifications = true # thông báo Windows mới (lần đầu Windows có thể hỏi quyền)
seconds = 4          # mỗi thông báo hiện bao lâu (2–30 giây); rê chuột vào thì giữ lại

[lookup]
# Tra cứu nhanh: nhấn phím tắt để mở hộp hỏi AI ngay trên island, Enter để gửi.
# Dùng Workers AI của Cloudflare: câu hỏi và vài lượt chat gần nhất được gửi tới Cloudflare.
# API token KHÔNG nằm trong file này: nhập trong cửa sổ Cài đặt, app cất vào
# Windows Credential Manager (mục "DynamicIsland/CloudflareAIToken").
enabled = false
hotkey = "Ctrl+Alt+`"              # ví dụ "Ctrl+Shift+Space", "Alt+F2"
model = "@cf/openai/gpt-oss-20b"   # hoặc "@cf/openai/gpt-oss-120b" (thông minh hơn, chậm hơn)
account_id = ""                    # Account ID trong trang Cloudflare (dashboard > Workers AI)
# Lời dặn cho trợ lý: vai trò, giọng văn, độ dài câu trả lời
system_prompt = "Bạn là trợ lý thân thiện trên Dynamic Island của Windows. Trả lời ngắn gọn, rõ ràng, bằng ngôn ngữ người dùng đang dùng (mặc định tiếng Việt). Khi được hỏi một từ hoặc cụm từ, giải thích nghĩa trong 2–4 câu, có ví dụ nếu cần. Không dùng bảng hay định dạng Markdown phức tạp."
