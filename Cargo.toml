[package]
name = "hello_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectComposition", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_DirectWrite", "Win32_System_SystemInformation", "Media_Control", "Foundation", "Win32_System_WinRT", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"      # ưu tiên kích thước nhỏ
lto = true           # tối ưu liên kết toàn chương trình
codegen-units = 1    # biên dịch chậm hơn nhưng gọn hơn
panic = "abort"      # bỏ phần mã dọn dẹp khi panic
strip = true         # bỏ thông tin debug khỏi file .exe